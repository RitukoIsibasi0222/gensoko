<!doctype html>
<html
  lang="ja"
  data-theme-storage-key="gensoko-theme-v1"
  data-theme-media-query="(prefers-color-scheme: dark)"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    <script nonce="%sveltekit.nonce%">
      (() => {
        const root = document.documentElement;
        const storageKey = root.dataset.themeStorageKey;
        const mediaQuery = root.dataset.themeMediaQuery;
        if (!storageKey || !mediaQuery) return;

        let preference = null;
        try {
          const storedPreference = localStorage.getItem(storageKey);
          if (storedPreference === 'light' || storedPreference === 'dark') {
            preference = storedPreference;
          } else if (storedPreference !== null) {
            localStorage.removeItem(storageKey);
          }
        } catch {
          // storageが利用不能でもOS設定による初期描画を継続する
        }

        let systemTheme = 'light';
        try {
          systemTheme =
            typeof matchMedia === 'function' && matchMedia(mediaQuery).matches ? 'dark' : 'light';
        } catch {
          // matchMediaが利用不能な環境では安全なlightを使う
        }

        const resolvedTheme = preference ?? systemTheme;
        root.dataset.theme = resolvedTheme;
        root.style.colorScheme = resolvedTheme;
      })();
    </script>
    %sveltekit.head%
  </head>

  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
