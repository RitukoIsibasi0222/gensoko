name: Validate and alias Vercel Preview
description: Validate an exact staging Preview, update the fixed alias, smoke it, and roll back on failure.

inputs:
  deployment-url-file:
    description: Temporary file containing the candidate deployment URL.
    required: true
  expected-sha:
    description: Exact lowercase Git commit SHA.
    required: true
  expected-ref:
    description: Exact Git ref metadata.
    required: true
  expected-target:
    description: Exact Vercel target.
    required: true
  alias:
    description: Fixed staging alias hostname.
    required: true
  vercel-token:
    description: Staging-scoped Vercel token.
    required: true
  automation-bypass-secret:
    description: Optional staging Deployment Protection bypass secret.
    required: false
    default: ""
  smoke-marker:
    description: Stable marker required in the staging HTML.
    required: true

runs:
  using: composite
  steps:
    - name: Validate candidate, update alias, smoke and roll back on failure
      shell: bash
      env:
        INPUT_DEPLOYMENT_URL_FILE: ${{ inputs.deployment-url-file }}
        INPUT_EXPECTED_SHA: ${{ inputs.expected-sha }}
        INPUT_EXPECTED_REF: ${{ inputs.expected-ref }}
        INPUT_EXPECTED_TARGET: ${{ inputs.expected-target }}
        INPUT_ALIAS: ${{ inputs.alias }}
        INPUT_VERCEL_TOKEN: ${{ inputs.vercel-token }}
        INPUT_AUTOMATION_BYPASS_SECRET: ${{ inputs.automation-bypass-secret }}
        INPUT_SMOKE_MARKER: ${{ inputs.smoke-marker }}
      run: |
        set -Eeuo pipefail
        candidate_state="$RUNNER_TEMP/vercel-candidate-state.json"
        candidate_id_file="$RUNNER_TEMP/vercel-candidate-id"
        previous_state="$RUNNER_TEMP/vercel-previous-state.json"
        previous_deployment="$RUNNER_TEMP/vercel-previous-deployment"
        previous_id_file="$RUNNER_TEMP/vercel-previous-id"
        alias_state="$RUNNER_TEMP/vercel-alias-state.json"
        rollback_state="$RUNNER_TEMP/vercel-rollback-state.json"
        alias_update_attempted=false

        cleanup_files() {
          rm -f "$candidate_state" "$candidate_id_file" "$previous_state" "$previous_deployment" "$previous_id_file" "$alias_state" "$rollback_state"
        }

        rollback_alias() {
          trap - ERR
          rollback_ok=false
          if [ "$alias_update_attempted" = "true" ] && npx --yes vercel@50.17.1 alias set "$(cat "$previous_deployment")" "$INPUT_ALIAS" --scope="$VERCEL_ORG_ID" --token="$INPUT_VERCEL_TOKEN" >/dev/null 2>&1; then
            if npx --yes vercel@50.17.1 inspect "https://$INPUT_ALIAS" --format=json --scope="$VERCEL_ORG_ID" --token="$INPUT_VERCEL_TOKEN" >"$rollback_state" 2>/dev/null && EXPECTED_ID_FILE="$previous_id_file" DEPLOYMENT_STATE="$rollback_state" node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const expectedId = readFileSync(process.env.EXPECTED_ID_FILE, "utf8").trim();
              const deployment = JSON.parse(readFileSync(process.env.DEPLOYMENT_STATE, "utf8"));
              if (deployment.id !== expectedId || deployment.readyState !== "READY") process.exit(1);
            '; then
              rollback_ok=true
            fi
          fi
          if [ "$rollback_ok" = "true" ]; then
            printf '%s\n' "- Status: ROLLED_BACK" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "staging aliasの自動rollbackを確認できません"
          fi
          exit 1
        }

        trap cleanup_files EXIT
        cleanup_files

        if [[ ! "$INPUT_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || [ "$INPUT_EXPECTED_REF" != "develop" ] || [ "$INPUT_EXPECTED_TARGET" != "preview" ]; then
          echo "staging Preview alias入力が不正です"
          exit 1
        fi
        if [ "$INPUT_ALIAS" != "gensoko-frontend-staging-develop.vercel.app" ] || [ -z "$INPUT_SMOKE_MARKER" ]; then
          echo "staging Preview alias入力が不正です"
          exit 1
        fi
        if [ -z "$VERCEL_PROJECT_ID" ] || [[ "$VERCEL_PROJECT_ID" =~ [[:space:]] ]] || [ -z "$VERCEL_ORG_ID" ] || [[ "$VERCEL_ORG_ID" =~ [[:space:]] ]]; then
          echo "staging Vercel project設定が不正です"
          exit 1
        fi
        if [ -z "$INPUT_VERCEL_TOKEN" ] || [[ "$INPUT_VERCEL_TOKEN" =~ [[:space:]] ]]; then
          echo "staging Vercel認証設定が不正です"
          exit 1
        fi
        if [ -n "$INPUT_AUTOMATION_BYPASS_SECRET" ] && [[ "$INPUT_AUTOMATION_BYPASS_SECRET" =~ [[:space:]] ]]; then
          echo "staging automation bypass設定が不正です"
          exit 1
        fi
        echo "::add-mask::$INPUT_VERCEL_TOKEN"
        if [ -n "$INPUT_AUTOMATION_BYPASS_SECRET" ]; then
          echo "::add-mask::$INPUT_AUTOMATION_BYPASS_SECRET"
        fi

        VERCEL_TOKEN="$INPUT_VERCEL_TOKEN" node --input-type=module -e '
            try {
              const projectUrl = new URL(`https://api.vercel.com/v9/projects/${encodeURIComponent(process.env.VERCEL_PROJECT_ID)}`);
              projectUrl.searchParams.set("teamId", process.env.VERCEL_ORG_ID);
              const response = await fetch(projectUrl, {
                headers: { authorization: `Bearer ${process.env.VERCEL_TOKEN}` },
                signal: AbortSignal.timeout(15000),
              });
              if (!response.ok) process.exit(1);
              const project = await response.json();
              if (project.id !== process.env.VERCEL_PROJECT_ID
                || project.name !== "gensoko-frontend-staging") process.exit(1);
            } catch {
              process.exit(1);
            }
          '

        if [ ! -f "$INPUT_DEPLOYMENT_URL_FILE" ]; then
          echo "candidate deployment参照がありません"
          exit 1
        fi
        candidate_url="$(awk 'NF { line=$0 } END { print line }' "$INPUT_DEPLOYMENT_URL_FILE" | tr -d '\r')"
        candidate_host="${candidate_url#https://}"
        if [ "$candidate_url" != "https://$candidate_host" ] || [[ ! "$candidate_host" =~ ^[a-z0-9-]+\.vercel\.app$ ]]; then
          echo "candidate deployment参照が不正です"
          exit 1
        fi

        vercel_list=(npx --yes vercel@50.17.1 list gensoko-frontend-staging --meta "githubCommitSha=$INPUT_EXPECTED_SHA" --status READY --environment "$INPUT_EXPECTED_TARGET" --format=json --scope="$VERCEL_ORG_ID" --token="$INPUT_VERCEL_TOKEN")
        if ! "${vercel_list[@]}" >"$candidate_state" 2>/dev/null; then
          echo "candidate deployment metadataを確認できません"
          exit 1
        fi
        EXPECTED_SHA="$INPUT_EXPECTED_SHA" EXPECTED_REF="$INPUT_EXPECTED_REF" EXPECTED_TARGET="$INPUT_EXPECTED_TARGET" EXPECTED_URL="$candidate_host" CANDIDATE_STATE="$candidate_state" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const payload = JSON.parse(readFileSync(process.env.CANDIDATE_STATE, "utf8"));
            const deployments = Array.isArray(payload.deployments) ? payload.deployments : [];
            const matches = deployments.filter((deployment) => {
              const target = deployment.target ?? "preview";
              return deployment.state === "READY"
                && target === process.env.EXPECTED_TARGET
                && deployment.url === process.env.EXPECTED_URL
                && deployment.meta?.githubCommitSha === process.env.EXPECTED_SHA
                && deployment.meta?.githubCommitRef === process.env.EXPECTED_REF
                && typeof deployment.id === "string";
            });
            if (matches.length !== 1) process.exit(1);
            process.stdout.write(matches[0].id);
          ' >"$candidate_id_file"

        npx --yes vercel@50.17.1 inspect "https://$INPUT_ALIAS" --format=json --scope="$VERCEL_ORG_ID" --token="$INPUT_VERCEL_TOKEN" >"$previous_state" 2>/dev/null
        PREVIOUS_STATE="$previous_state" PREVIOUS_DEPLOYMENT="$previous_deployment" PREVIOUS_ID_FILE="$previous_id_file" node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const deployment = JSON.parse(readFileSync(process.env.PREVIOUS_STATE, "utf8"));
            if (deployment.readyState !== "READY"
              || typeof deployment.id !== "string"
              || typeof deployment.url !== "string"
              || !/^[a-z0-9-]+\.vercel\.app$/.test(deployment.url)) process.exit(1);
            writeFileSync(process.env.PREVIOUS_DEPLOYMENT, `https://${deployment.url}`);
            writeFileSync(process.env.PREVIOUS_ID_FILE, deployment.id);
          '

        alias_update_attempted=true
        trap rollback_alias ERR
        npx --yes vercel@50.17.1 alias set "$candidate_url" "$INPUT_ALIAS" --scope="$VERCEL_ORG_ID" --token="$INPUT_VERCEL_TOKEN" >/dev/null 2>&1

        npx --yes vercel@50.17.1 inspect "https://$INPUT_ALIAS" --format=json --scope="$VERCEL_ORG_ID" --token="$INPUT_VERCEL_TOKEN" >"$alias_state" 2>/dev/null
        EXPECTED_ID_FILE="$candidate_id_file" EXPECTED_TARGET="$INPUT_EXPECTED_TARGET" DEPLOYMENT_STATE="$alias_state" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const expectedId = readFileSync(process.env.EXPECTED_ID_FILE, "utf8").trim();
            const deployment = JSON.parse(readFileSync(process.env.DEPLOYMENT_STATE, "utf8"));
            if (deployment.id !== expectedId
              || deployment.readyState !== "READY"
              || deployment.target !== process.env.EXPECTED_TARGET) process.exit(1);
          '

        SMOKE_URL="https://$INPUT_ALIAS/" SMOKE_MARKER="$INPUT_SMOKE_MARKER" AUTOMATION_BYPASS_SECRET="$INPUT_AUTOMATION_BYPASS_SECRET" node --input-type=module -e '
            const url = new URL(process.env.SMOKE_URL);
            const headers = process.env.AUTOMATION_BYPASS_SECRET
              ? { "x-vercel-protection-bypass": process.env.AUTOMATION_BYPASS_SECRET }
              : {};
            const response = await fetch(url, {
              headers,
              redirect: "error",
              signal: AbortSignal.timeout(15000),
            });
            if (response.status !== 200
              || new URL(response.url).origin !== url.origin
              || !response.headers.get("content-type")?.includes("text/html")) process.exit(1);
            const html = await response.text();
            if (!html.includes(process.env.SMOKE_MARKER)) process.exit(1);
          '

        trap - ERR
        printf '%s\n' "- Status: ALIAS_UPDATED" "- Status: SMOKE_CLEAR" >> "$GITHUB_STEP_SUMMARY"
