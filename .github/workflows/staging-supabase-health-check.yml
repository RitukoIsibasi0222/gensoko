name: Supabase Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0,8,16 * * *"

permissions: {}

concurrency:
  group: gensoko-staging-supabase-health-check
  cancel-in-progress: false

jobs:
  staging-supabase-health-check:
    name: Query ${{ matrix.target }} database through API
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: staging
            url: https://gensoko-api-staging.rituko-labs.workers.dev/api/v1/elements/1
          - target: production
            url: https://api.gensoko.app/api/v1/elements/1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEALTH_CHECK_URL: ${{ matrix.url }}

    steps:
      - name: Validate workflow branch
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "health checkはmain branchから実行してください"
            exit 1
          fi

      - name: Query database through the API
        run: |
          set -euo pipefail

          curl_options=(
            --silent
            --show-error
            --header "Cache-Control: no-cache"
            --fail-with-body
            --connect-timeout 15
            --max-time 30
            --retry 2
            --retry-delay 5
            --retry-all-errors
            --output /dev/null
            --write-out "%{http_code}"
          )

          set +e
          http_status="$(curl "${curl_options[@]}" "$HEALTH_CHECK_URL")"
          curl_exit=$?
          set -e

          if [ "$curl_exit" -ne 0 ] || [ "$http_status" != "200" ]; then
            echo "Supabaseヘルスチェックに失敗しました（HTTP ${http_status:-unavailable}）"
            exit 1
          fi

          echo "Supabaseヘルスチェックに成功しました"
