name: Backend PR Quality

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "backend/**"
      - ".github/actions/backend-quality/**"
      - ".github/workflows/backend-pr-quality.yml"
      - ".github/workflows/production-deploy.yml"

permissions:
  contents: read

concurrency:
  group: backend-pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/backend-quality
