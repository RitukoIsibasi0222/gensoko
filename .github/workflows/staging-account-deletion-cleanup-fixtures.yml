name: Staging Account Deletion Cleanup Fixtures

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Manage isolated synthetic fixtures
        required: true
        type: choice
        options:
          - prepare
          - verify-isolated
          - verify-cleaned
          - remove

jobs:
  staging-fixtures:
    name: Manage staging account deletion cleanup fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: gensoko-batch-jobs
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      BATCH_ENVIRONMENT: ${{ vars.BATCH_ENVIRONMENT }}
      ACCOUNT_DATA_DELETION_STAGING_FIXTURES_ENABLED: ${{ vars.ACCOUNT_DATA_DELETION_STAGING_FIXTURES_ENABLED }}
      STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}

    steps:
      - name: Validate staging fixture environment
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "$GITHUB_REF_NAME" != "develop" ]; then
            echo "staging fixture management requires the develop branch"
            exit 1
          fi
          if [ "$BATCH_ENVIRONMENT" != "staging" ]; then
            echo "invalid staging environment"
            exit 1
          fi
          if [ "$ACCOUNT_DATA_DELETION_STAGING_FIXTURES_ENABLED" != "true" ]; then
            echo "staging account deletion fixtures are disabled"
            exit 1
          fi
          if [ -z "$STAGING_SUPABASE_PROJECT_REF" ] || [ -z "$DATABASE_URL" ]; then
            echo "staging account deletion fixture configuration is incomplete"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma generate

      - name: Manage staging fixtures
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIXTURE_OPERATION: ${{ inputs.operation }}
        run: npm run staging:account-deletion-cleanup-fixtures -- --operation "$FIXTURE_OPERATION"
