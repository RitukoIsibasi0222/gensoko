name: Frontend PR Quality

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "frontend/**"
      - ".github/actions/frontend-quality/**"
      - ".github/workflows/frontend-pr-quality.yml"
      - ".github/workflows/production-deploy.yml"

permissions:
  contents: read

concurrency:
  group: frontend-pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/frontend-quality
        with:
          git-ref: ${{ github.base_ref }}
