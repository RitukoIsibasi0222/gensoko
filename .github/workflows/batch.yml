name: Batch Jobs

on:
  workflow_dispatch:
    inputs:
      batch_job:
        description: 実行する定期バッチ
        required: true
        type: choice
        options:
          - weekly-reset
          - game-question-set-cleanup
          - audit-log-cleanup-dry-run
          - audit-log-cleanup-execute
  schedule:
    - cron: "7 15 * * 0"
    - cron: "17,47 * * * *"
    - cron: "37 18 * * *"

jobs:
  scheduled-batch:
    name: Run scheduled batch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: gensoko-batch-jobs
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      AUDIT_LOG_RETENTION_DAYS: ${{ vars.AUDIT_LOG_RETENTION_DAYS }}
      AUDIT_LOG_CLEANUP_ENABLED: ${{ vars.AUDIT_LOG_CLEANUP_ENABLED }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma generate

      - name: Resolve scheduled cron
        if: >-
          github.event_name == 'schedule' ||
          inputs.batch_job == 'weekly-reset' ||
          inputs.batch_job == 'game-question-set-cleanup'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ inputs.batch_job }}" in
              weekly-reset)
                echo "BATCH_CRON=7 15 * * 0" >> "$GITHUB_ENV"
                ;;
              game-question-set-cleanup)
                echo "BATCH_CRON=17,47 * * * *" >> "$GITHUB_ENV"
                ;;
              *)
                echo "未対応の定期バッチです"
                exit 1
                ;;
            esac
          else
            echo "BATCH_CRON=${{ github.event.schedule }}" >> "$GITHUB_ENV"
          fi

      - name: Run scheduled batch
        if: >-
          github.event_name == 'schedule' ||
          inputs.batch_job == 'weekly-reset' ||
          inputs.batch_job == 'game-question-set-cleanup'
        working-directory: backend
        timeout-minutes: 10
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run batch:scheduled

      - name: Preview audit log cleanup
        if: inputs.batch_job == 'audit-log-cleanup-dry-run'
        working-directory: backend
        timeout-minutes: 10
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run cleanup:audit-logs -- --dry-run

      - name: Execute audit log cleanup
        if: inputs.batch_job == 'audit-log-cleanup-execute'
        working-directory: backend
        timeout-minutes: 10
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run cleanup:audit-logs -- --execute
